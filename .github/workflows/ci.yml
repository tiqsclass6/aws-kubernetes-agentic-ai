name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.15.8"
  OPA_VERSION: "1.19.1"
  CONFTEST_VERSION: "0.69.0"
  TRIVY_VERSION: "0.74.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.3"

      - name: Parse Kubernetes YAML
        run: |
          python - <<'PY_YAML'
          from pathlib import Path
          import yaml

          for path in sorted(Path("manifests").rglob("*.yaml")):
              with path.open(encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))
              print(f"validated {path}")
          PY_YAML

      - name: Check shell-script syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  python:
    name: Python
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements-*.txt

      - name: Install live-pipeline Python dependencies
        run: |
          python -m pip install --upgrade pip
          cat \
            python/requirements-aggregator.txt \
            python/requirements-observer-agent.txt \
            python/requirements-correlation-agent.txt \
            python/requirements-ir-analyst-agent.txt \
            python/requirements-governance-agent.txt \
            python/requirements-approval-agent.txt \
            python/requirements-remediation-agent.txt \
            python/requirements-reporting-agent.txt \
            python/requirements-mcp-server.txt \
            python/requirements-test.txt \
            | sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' \
            | sort -fu > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Compile and test Python
        env:
          PROJECT_ID: unit-test-project
          INPUT_SUBSCRIPTION: unit-test-subscription
          OUTPUT_TOPIC: unit-test-topic
          KMS_KEY_VERSION: projects/unit-test-project/locations/us-central1/keyRings/test/cryptoKeys/approval/cryptoKeyVersions/1
          POLICY_FILE: policy/governance/remediation.rego
        run: |
          python -m compileall -q python
          pytest -q python/tests

  terraform:
    name: Terraform
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  policy:
    name: Policy
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install OPA and Conftest
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa

          curl --fail --silent --show-error --location \
            --output /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
          sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest

      - name: Test governance policy
        run: opa test policy/governance -v

      - name: Evaluate Kubernetes policy
        run: bash scripts/02-conftest-test.sh

  scan:
    name: Scan
    needs: [python, terraform, policy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          curl --fail --silent --show-error --location \
            --output "/tmp/${archive}" \
            "${base_url}/${archive}"
          curl --fail --silent --show-error --location \
            --output /tmp/trivy_checksums.txt \
            "${base_url}/trivy_${TRIVY_VERSION}_checksums.txt"

          (
            cd /tmp
            grep " ${archive}$" trivy_checksums.txt | sha256sum --check --strict -
            tar -xzf "${archive}" trivy
          )

          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan repository with Trivy
        env:
          TF_VAR_project_id: class-6-5-tiqs
        run: |
          trivy filesystem \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy-results.sarif \
            --ignorefile .trivyignore.yaml \
            --skip-dirs examples \
            --skip-files manifests/broken-app.yaml \
            .

      - name: Upload Trivy SARIF
        if: >-
          always() &&
          hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          wait-for-processing: false

  ci:
    name: CI
    if: ${{ !cancelled() }}
    needs: [python, terraform, policy, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every pipeline section
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          echo "python=${PYTHON_RESULT} terraform=${TERRAFORM_RESULT} policy=${POLICY_RESULT} scan=${SCAN_RESULT}"
          [[ "${PYTHON_RESULT}" == success && "${TERRAFORM_RESULT}" == success && "${POLICY_RESULT}" == success && "${SCAN_RESULT}" == success ]]
