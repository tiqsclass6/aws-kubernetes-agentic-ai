name: Governed Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy signed image digests to GKE
        type: boolean
        required: true
        default: false
      tag:
        description: Immutable release tag
        type: string
        required: true
        default: v1

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: vertex-agent-lab
  CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION }}
  RELEASE_TAG: ${{ inputs.tag }}
  TRIVY_VERSION: "0.76.0"
  SYFT_VERSION: "1.54.1"
  RELEASE_SIGNER_OIDC_ISSUER: https://token.actions.githubusercontent.com
  RELEASE_SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}

jobs:
  # Build, scan, sign, and attest. Runs without an environment so build-only
  # releases (deploy=false) never wait for approval.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build, scan, attest, and sign images
        run: bash scripts/13-release-images.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.tag }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90

  # Roll the signed digests out to GKE. The production environment requires a
  # reviewer, so this job pauses for approval after the release job succeeds.
  deploy:
    needs: release
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.tag }}
          path: release-evidence/

      - name: Verify image lock checksum
        run: |
          expected="$(cut -d ' ' -f1 release-evidence/image-lock.sha256)"
          echo "${expected}  release-evidence/image-lock.json" | sha256sum --check -

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${CLUSTER_NAME}" \
            --location "${CLUSTER_LOCATION}" \
            --project "${PROJECT_ID}"

      - name: Deploy immutable image digests
        run: bash scripts/14-deploy-release-images.sh release-evidence/image-lock.json
