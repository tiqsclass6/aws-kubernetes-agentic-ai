apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-agent
  namespace: ai-governance
  annotations:
    iam.gke.io/gcp-service-account: governance-agent@class-6-5-tiqs.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-agent-config
  namespace: ai-governance
data:
  PROJECT_ID: class-6-5-tiqs
  INPUT_SUBSCRIPTION: governance-agent-sub
  OUTPUT_TOPIC: governance-decisions
  HEALTH_PORT: "8080"
  FIRESTORE_DATABASE: "(default)"
  APPROVAL_COLLECTION: approval_requests
  APPROVAL_REQUESTS_TOPIC: approval-requests
  GOVERNANCE_AUDIT_TOPIC: governance-audit
  OPA_DECISION_URL: http://127.0.0.1:8181/v1/data/agentic/governance/decision
  OPA_TIMEOUT_SECONDS: "5"
  OPA_STARTUP_TIMEOUT_SECONDS: "60"
  POLICY_FILE: /policies/remediation.rego
  POLICY_ID: remediation
  POLICY_VERSION: 1.0.0
  AUTOMATION_MODE: disabled
  DECISION_TTL_SECONDS: "900"
  APPROVAL_TTL_SECONDS: "1800"
  APPROVAL_CONFIDENCE: "0.85"
  AUTOMATIC_CONFIDENCE: "0.95"
  AUTOMATIC_MIN_SIGNALS: "3"
  AUTOMATIC_MIN_SOURCES: "2"
  AUTOMATIC_MIN_EVIDENCE: "3"
  ALLOWED_NAMESPACES: app01
  ALLOWED_DEPLOYMENTS: broken-app
  MAX_CONCURRENT_MESSAGES: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-agent
  namespace: ai-governance
  labels:
    app: governance-agent
    app.kubernetes.io/name: governance-agent
    app.kubernetes.io/component: policy-decision-point
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: governance-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: governance-agent
        app.kubernetes.io/name: governance-agent
        app.kubernetes.io/component: policy-decision-point
    spec:
      serviceAccountName: governance-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: governance-agent
          image: us-central1-docker.pkg.dev/class-6-5-tiqs/vertex-agent-lab/governance-agent:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: governance-agent-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: governance-policy
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: opa
          image: openpolicyagent/opa:1.18.2
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-format=json
            - --log-level=info
            - /policies/remediation.rego
          ports:
            - name: opa
              containerPort: 8181
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: opa
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: opa
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: governance-policy
              mountPath: /policies
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: governance-policy
          configMap:
            name: governance-policy
        - name: tmp
          emptyDir: {}
