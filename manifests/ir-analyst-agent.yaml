apiVersion: v1
kind: ServiceAccount
metadata:
  name: ir-analyst-agent
  namespace: ai-agents
  annotations:
    iam.gke.io/gcp-service-account: vertex-gke-agent@class-6-5-tiqs.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ir-analyst-agent-config
  namespace: ai-agents
data:
  PROJECT_ID: class-6-5-tiqs
  LOCATION: us-central1
  MODEL: gemini-2.5-flash
  INPUT_SUBSCRIPTION: ir-analyst-agent-sub
  OUTPUT_TOPIC: analyzed-incidents
  HEALTH_PORT: "8080"
  MAX_SIGNALS_IN_PROMPT: "15"
  MAX_CONCURRENT_MESSAGES: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir-analyst-agent
  namespace: ai-agents
  labels:
    app: ir-analyst-agent
    app.kubernetes.io/name: ir-analyst-agent
    app.kubernetes.io/component: incident-analysis
spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: ir-analyst-agent

  template:
    metadata:
      labels:
        app: ir-analyst-agent
        app.kubernetes.io/name: ir-analyst-agent
        app.kubernetes.io/component: incident-analysis

    spec:
      serviceAccountName: ir-analyst-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ir-analyst-agent

          image: >-
            us-central1-docker.pkg.dev/class-6-5-tiqs/vertex-agent-lab/ir-analyst-agent:phase3-v1

          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: ir-analyst-agent-config

          ports:
            - name: health
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 150m
              memory: 192Mi

            limits:
              cpu: 750m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: health

            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /readyz
              port: health

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: health

            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}