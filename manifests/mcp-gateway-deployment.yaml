apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/component: security-gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: mcp-gateway

  template:
    metadata:
      labels:
        app: mcp-gateway
        app.kubernetes.io/name: mcp-gateway
        app.kubernetes.io/component: security-gateway

    spec:
      serviceAccountName: mcp-gateway-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: https
              containerPort: 8443
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          startupProbe:
            tcpSocket:
              port: https

            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: https

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: https

            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true

            - name: server-tls
              mountPath: /etc/nginx/tls
              readOnly: true

            - name: client-ca
              mountPath: /etc/nginx/client-ca
              readOnly: true

            - name: var-cache-nginx
              mountPath: /var/cache/nginx

            - name: var-run
              mountPath: /var/run

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nginx-config
          configMap:
            name: mcp-nginx-config

        - name: server-tls
          secret:
            secretName: mcp-gateway-server-tls
            defaultMode: 0440

        - name: client-ca
          secret:
            secretName: mcp-client-ca
            defaultMode: 0440

        - name: var-cache-nginx
          emptyDir: {}

        - name: var-run
          emptyDir: {}

        - name: tmp
          emptyDir: {}