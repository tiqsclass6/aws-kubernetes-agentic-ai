apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-nginx-config
  namespace: mcp-gateway
data:
  default.conf: |
    server {
        listen 8443 ssl;

        server_name \
            mcp-gateway.mcp-gateway.svc.cluster.local;

        server_tokens off;

        # Gateway server certificate.
        ssl_certificate \
            /etc/nginx/tls/tls.crt;

        ssl_certificate_key \
            /etc/nginx/tls/tls.key;

        # Client certificate authority.
        ssl_client_certificate \
            /etc/nginx/client-ca/ca.crt;

        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_session_cache shared:MCP:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        client_max_body_size 64k;

        add_header \
            Strict-Transport-Security \
            "max-age=31536000" \
            always;

        add_header \
            X-Frame-Options \
            DENY \
            always;

        add_header \
            X-Content-Type-Options \
            nosniff \
            always;

        add_header \
            Referrer-Policy \
            no-referrer \
            always;

        location / {
            proxy_pass \
                http://mcp-server.mcp.svc.cluster.local:9000;

            proxy_http_version 1.1;

            proxy_set_header \
                Host \
                $host;

            proxy_set_header \
                Connection \
                "";

            proxy_set_header \
                X-Request-ID \
                $request_id;

            proxy_set_header \
                X-Client-Verify \
                $ssl_client_verify;

            proxy_set_header \
                X-Client-DN \
                $ssl_client_s_dn;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;

            proxy_hide_header Server;
        }
    }