apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app01-default-deny
  namespace: app01
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app01-allow-dns
  namespace: app01
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Dataplane V2 applies policy after DNAT, so kube-dns pods must be allowed.
    # NodeLocal DNSCache (enabled on this GKE channel) serves 169.254.20.10.
    # The ClusterIP allow covers the kube-dns service VIP.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.112.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broken-app-to-postgres
  namespace: app01
spec:
  podSelector:
    matchLabels:
      app: broken-app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-broken-app
  namespace: app01
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: broken-app
      ports:
        - protocol: TCP
          port: 5432