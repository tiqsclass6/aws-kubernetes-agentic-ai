apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app01-default-deny
  namespace: app01
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app01-allow-dns
  namespace: app01
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # kube-dns's ClusterIP, not a podSelector: Calico on this cluster does not
    # reliably enforce namespaceSelector+podSelector egress rules targeting
    # kube-dns, silently dropping DNS queries even though the rule matches.
    - to:
        - ipBlock:
            cidr: 10.112.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broken-app-to-postgres
  namespace: app01
spec:
  podSelector:
    matchLabels:
      app: broken-app
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-broken-app
  namespace: app01
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: broken-app
      ports:
        - protocol: TCP
          port: 5432