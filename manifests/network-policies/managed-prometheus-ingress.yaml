apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-prometheus-scrape
  namespace: ai-agents
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - observer-agent
          - correlation-agent
          - ir-analyst-agent
          - remediation-agent
          - reporting-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - gmp-system
                  - gke-gmp-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      ports:
        - protocol: TCP
          port: 8080
