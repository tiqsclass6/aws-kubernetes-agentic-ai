apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-restricted-egress
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway

  policyTypes:
    - Egress

  egress:
    # Permit the gateway to reach only the MCP server.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp

          podSelector:
            matchLabels:
              app: mcp-server

      ports:
        - protocol: TCP
          port: 9000

    # kube-dns's ClusterIP, not a podSelector: Calico on this cluster does not
    # reliably enforce namespaceSelector+podSelector egress rules targeting
    # kube-dns, silently dropping DNS queries even though the rule matches.
    - to:
        - ipBlock:
            cidr: 10.112.0.10/32

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53