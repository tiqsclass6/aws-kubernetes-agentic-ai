apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-restricted-egress
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway

  policyTypes:
    - Egress

  egress:
    # Permit the gateway to reach only the MCP server.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp

          podSelector:
            matchLabels:
              app: mcp-server

      ports:
        - protocol: TCP
          port: 9000

    # Dataplane V2 applies policy after DNAT, so kube-dns pods must be allowed.
    # NodeLocal DNSCache (enabled on this GKE channel) serves 169.254.20.10.
    # The ClusterIP allow covers the kube-dns service VIP.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.112.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53