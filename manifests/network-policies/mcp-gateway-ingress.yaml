apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-allow-remediation-agent-only
  namespace: mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: mcp-gateway

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-agents

          podSelector:
            matchLabels:
              app: remediation-agent

      ports:
        - protocol: TCP
          port: 8443