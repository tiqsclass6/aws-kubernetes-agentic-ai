# Real database for broken-app to connect to (see app.py) - replaces the fictional
# "db.internal.local" hostname the original synthetic error hardcoded. emptyDir
# storage is intentional: this is a demo instance, data doesn't need to survive a
# pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: app01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom:
        - secretRef:
            name: postgres-credentials
        ports:
        - containerPort: 5432
        # The upstream entrypoint starts as root to chown $PGDATA and the socket
        # directory, then drops privileges itself (gosu) before running postgres --
        # it cannot be forced to runAsNonRoot. readOnlyRootFilesystem is still safe
        # since every path it writes to is one of the volumes mounted below.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
      volumes:
      - name: pgdata
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app01
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
