# The GitHub release Google service account receives only namespaced permission
# to update Deployment container images and observe rollout status. Google Cloud
# IAM grants only roles/container.clusterViewer for cluster authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-release-deployer
  namespace: ai-agents
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-release-deployer
  namespace: ai-agents
subjects:
  - kind: User
    name: github-release@class-6-5-tiqs.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-release-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-release-deployer
  namespace: shared-services
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-release-deployer
  namespace: shared-services
subjects:
  - kind: User
